apiVersion: v1
kind: ServiceAccount
metadata:
  name: conforma-knative-service
  namespace: conforma
---
# Controller namespace Role: ConfigMap reads and Job management in conforma ns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conforma-knative-service
  namespace: conforma
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conforma-knative-service
  namespace: conforma
subjects:
  - kind: ServiceAccount
    name: conforma-knative-service
roleRef:
  kind: Role
  name: conforma-knative-service
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole: cross-namespace access to Konflux CRDs only
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: conforma-knative-service-cluster
rules:
  - apiGroups: ["appstudio.redhat.com"]
    resources: ["snapshots", "releaseplans", "releaseplanadmissions", "enterprisecontractpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: conforma-knative-service-cluster
subjects:
  - kind: ServiceAccount
    name: conforma-knative-service
    namespace: conforma
roleRef:
  kind: ClusterRole
  name: conforma-knative-service-cluster
  apiGroup: rbac.authorization.k8s.io
---
# Service account for jobs created by the conforma controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conforma-vsa-generator
  namespace: conforma
---
# Job SA: get the VSA signing key in conforma namespace.
# If VSA_SIGNING_KEY_SECRET_NAME is changed in the ConfigMap,
# update resourceNames here to match.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conforma-vsa-generator
  namespace: conforma
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vsa-signing-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conforma-vsa-generator
  namespace: conforma
subjects:
  - kind: ServiceAccount
    name: conforma-vsa-generator
    namespace: conforma
roleRef:
  kind: Role
  name: conforma-vsa-generator
  apiGroup: rbac.authorization.k8s.io
---
# Job SA: get the public verification key in openshift-pipelines namespace.
# If PUBLIC_KEY is changed in the ConfigMap to reference a different
# secret name or namespace, update this Role/RoleBinding to match.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conforma-vsa-generator
  namespace: openshift-pipelines
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["public-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conforma-vsa-generator
  namespace: openshift-pipelines
subjects:
  - kind: ServiceAccount
    name: conforma-vsa-generator
    namespace: conforma
roleRef:
  kind: Role
  name: conforma-vsa-generator
  apiGroup: rbac.authorization.k8s.io
